<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f3a4a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#f4f5f3; --surface:#ffffff; --ink:#1b2127; --muted:#6a747a; --line:#e2e5e3;
  --green:#23804a; --amber:#b87700; --red1:#d9544a; --red2:#9e1c14; --accent:#27465a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#14181b; --surface:#1c2125; --ink:#e7ebec; --muted:#9aa4a9; --line:#2e353a;
    --green:#5cc487; --amber:#eab04a; --red1:#ff9a90; --red2:#ff4d40; --accent:#8fb3c9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#14181b; --surface:#1c2125; --ink:#e7ebec; --muted:#9aa4a9; --line:#2e353a;
  --green:#5cc487; --amber:#eab04a; --red1:#ff9a90; --red2:#ff4d40; --accent:#8fb3c9;
}
html{background:var(--ground)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ground);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.asof{color:var(--muted);font-size:14px}
.months{display:flex;gap:6px;flex-wrap:wrap}
.months button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.months button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.months button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.months button.g{color:var(--green);border-color:var(--green)} .months button.a{color:var(--amber);border-color:var(--amber)}
.months button.r{color:var(--red1);border-color:var(--red1)} .months button.rr{color:var(--red2);border-color:var(--red2);font-weight:700}
.months button[aria-pressed="true"].g{background:var(--green);color:var(--surface)} .months button[aria-pressed="true"].a{background:var(--amber);color:var(--surface)}
.months button[aria-pressed="true"].r{background:var(--red1);color:var(--surface)} .months button[aria-pressed="true"].rr{background:var(--red2);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:10px 14px;border-bottom:1px solid var(--line)}
th:first-child{text-align:left}
td{padding:8px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child{text-align:left;white-space:normal}
tr.sub td{font-size:14px}
tr.sub td:first-child{padding-left:44px;color:var(--muted)}
tr[data-grp="disc"] td{color:var(--muted)}
.tog{font:inherit;font-weight:600;width:20px;height:20px;line-height:18px;padding:0;margin-right:8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--muted);cursor:pointer;vertical-align:-3px}
.tog:hover{color:var(--ink);border-color:var(--muted)}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
tr.total td{font-weight:700;background:var(--ground)}
tr.topline td{font-size:12px;line-height:1.35;color:var(--muted);text-align:left;white-space:normal;padding-top:0;padding-bottom:8px}
tr.topline.sub td{padding-left:44px}
tr.topline.total td{background:var(--ground);font-weight:400}
tr:has(+ tr.topline) td{border-bottom:none;padding-bottom:2px}
tr.grand td{font-weight:700;border-bottom:none}
.parts{display:block;font-size:12px;color:var(--muted)}
.pct{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.g{color:var(--green)} .a{color:var(--amber)} .r{color:var(--red1)} .rr{color:var(--red2);font-weight:700}
.legend{font-size:13px;color:var(--muted);max-width:65ch;display:flex;flex-direction:column;gap:4px}
.msg{padding:18px;color:var(--muted)}
a{color:var(--accent)}
@media (max-width:420px){ th,td{padding-inline:8px} .parts{display:block;font-size:12px;color:var(--muted)}
.pct{display:block;margin-left:0} }
form.lock{display:flex;flex-direction:column;gap:10px;max-width:320px;padding:18px}
form.lock label{font-weight:600}
form.lock input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
form.lock button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);cursor:pointer}
.err{color:var(--red1);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Monthly budget</h1>
    <div class="asof" id="asof">Loading…</div>
  </header>
  <div class="months" id="months" role="group" aria-label="Month"></div>
  <div class="card"><div id="table"><div class="msg">Loading spend…</div></div></div>
  <div class="legend">
    <div>Source: Simple view in <a href="https://docs.google.com/spreadsheets/d/1yKrmtj7UHxbCHb6mvvmmgmFUmpMAHhBlj0nc8wE-xfA/edit" target="_blank" rel="noopener">2026 Expenses</a>, refreshed by each expenses download.</div>
  </div>
</div>

<script>

const $ = id => document.getElementById(id);
const fmt = n => (n < 0 ? "-$" : "$") + Math.round(Math.abs(n)).toLocaleString("en-US");
let config = null, months = [], selected = null;

// Necessities pacing weights from Jan 2025 to Sep 2026 spend: Sat/Sun days count 1.40, Mon-Fri 0.84 (a week sums to 7).
const W_WEEKEND = 1.40, W_WEEKDAY = 0.84;
function weightedFrac(ym, day){
  const [y,m] = ym.split("-").map(Number), n = new Date(y, m, 0).getDate();
  let done = 0, all = 0;
  for (let i = 1; i <= n; i++){ const g = new Date(y, m-1, i).getDay(); const w = (g===0||g===6) ? W_WEEKEND : W_WEEKDAY; all += w; if (i <= day) done += w; }
  return Math.min(1, done / all);
}
function daysIn(ym){ const [y,m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function monthName(ym){ const [y,m] = ym.split("-").map(Number); return new Date(y, m-1, 1).toLocaleString("en-US",{month:"long",year:"numeric"}); }
function shortMonth(ym){ const [y,m] = ym.split("-").map(Number); return new Date(y, m-1, 1).toLocaleString("en-US",{month:"short"}); }

function cls(spend, expected, budget){
  if (budget === 0) return spend > 0.5 ? "rr" : "g";
  const r = expected > 0 ? spend / expected : 0;
  if (r <= 1) return "g";
  if (r <= 1.10) return "a";
  return r <= 1.30 ? "r" : "rr";
}
function pct(s, b){ return b > 0 ? `<span class="pct">(${Math.round((b-s)/b*100)}%)</span>` : ""; }
function row(name, b, s, e, extra, grp){
  return `<tr class="${extra||""}"${grp?` data-grp="${grp}"`:""}${grp&&collapsed[grp]?" hidden":""}><td>${name}</td><td class="num">${fmt(b)}</td><td><span class="${cls(s,e,b)}">${fmt(b-s)}</span>${pct(s,b)}</td></tr>`;
}
let collapsed = {need:true, disc:true};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Grey line under a row: the 3 biggest merchants/items across the given categories this month.
function topRow(top, cats, cls, grp){
  if (!top) return "";
  const items = [].concat(...cats.map(c => top[c] || [])).sort((a,b) => b[1]-a[1]).slice(0,3);
  if (!items.length) return "";
  const txt = items.map(([n,v,k]) => `${esc(n)} ${fmt(v)}${k>1?` (${k})`:""}`).join(" · ");
  return `<tr class="topline ${cls||""}"${grp?` data-grp="${grp}"`:""}${grp&&collapsed[grp]?" hidden":""}><td colspan="3">${txt}</td></tr>`;
}
function head(key, label){
  const open = !collapsed[key];
  return `<button type="button" class="tog" id="tog-${key}" data-key="${key}" aria-expanded="${open}" aria-label="${open?"Collapse":"Expand"} ${label}">${open?"\u2212":"+"}</button>${label}`;
}

function render(){
  if (!config || !selected) return;
  const doc = months.find(m => m.id === selected);
  if (!doc) return;
  const d = doc.data, spend = d.spend || {}, top = d.top;
  const days = daysIn(d.month);
  const asOf = new Date(d.asOf + "T12:00:00");
  const day = asOf.getMonth()+1 === Number(d.month.split("-")[1]) ? asOf.getDate() : days;
  const frac = Math.min(1, day / days);          // calendar pacing (Discretionary)
  const nfrac = weightedFrac(d.month, day);        // weekend-weighted pacing (Necessities)
  $("title").textContent = monthName(d.month);
  $("asof").textContent = "Through " + asOf.toLocaleString("en-US",{month:"short",day:"numeric"}) + " (" + (days-day) + " days, " + Math.round((1-nfrac)*100) + "% of the month left, weekends weighted)";
  const exp = l => l.mode === "fixed" ? l.budget : l.budget * nfrac;
  const rows = [];
  let rB=0,rS=0,rE=0;
  if (config.rent){ const l = config.rent; rB = l.budget; rS = Number(spend[l.cat]||0); rE = exp(l); rows.push(row("Rent", rB, rS, rE, "total")); rows.push(topRow(top, [l.cat], "total")); }
  let nB=0,nS=0,nE=0;
  const needRows=[];
  for (const l of config.necessities){
    const s = l.cats ? l.cats.reduce((t,c)=>t+Number(spend[c]||0),0) : Number(spend[l.cat]||0), e = exp(l);
    nB+=l.budget; nS+=s; nE+=e;
    const label = l.cats ? `${l.cat}<span class="parts">${l.cats.join(", ")}</span>` : l.cat;
    needRows.push(row(label, l.budget, s, e, "sub", "need"));
    needRows.push(topRow(top, l.cats || [l.cat], "sub", "need"));
  }
  rows.push(row(head("need","Necessities"), nB, nS, nE, "total"));
  if (collapsed.need) rows.push(topRow(top, config.necessities.flatMap(l => l.cats || [l.cat]), "total"));
  rows.push(...needRows);
  const disc = config.discretionary;
  let dS = 0; for (const c of disc.cats) dS += Number(spend[c]||0);
  const dE = disc.budget * frac;
  rows.push(row(head("disc","Discretionary"), disc.budget, dS, dE, "total"));
  if (collapsed.disc) rows.push(topRow(top, disc.cats, "total"));
  for (const c of disc.cats){ rows.push(`<tr class="sub" data-grp="disc"${collapsed.disc?" hidden":""}><td>${c}</td><td></td><td>${fmt(Number(spend[c]||0))} spent</td></tr>`); rows.push(topRow(top, [c], "sub", "disc")); }
  rows.push(row("Total", rB+nB+disc.budget, rS+nS+dS, rE+nE+dE, "grand"));
  $("table").innerHTML = `<table><thead><tr><th>Category</th><th>Budget</th><th>Left</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
  $("table").querySelectorAll(".tog").forEach(b => b.onclick = () => {
    const k = b.dataset.key; collapsed[k] = !collapsed[k];
    render();
    const nb = document.getElementById("tog-"+k); if (nb) nb.focus();
  });
}

// Colour for a month button: same rule as that month's Total row (budget, spend, pace-expected).
function monthCls(d){
  if (!config) return "";
  const spend = d.spend || {}, days = daysIn(d.month);
  const asOf = new Date(d.asOf + "T12:00:00");
  const day = asOf.getMonth()+1 === Number(d.month.split("-")[1]) ? asOf.getDate() : days;
  const frac = Math.min(1, day / days), nfrac = weightedFrac(d.month, day);
  const sp = c => Number(spend[c]||0);
  let B = 0, S = 0, E = 0;
  if (config.rent){ B += config.rent.budget; S += sp(config.rent.cat); E += config.rent.budget; }
  for (const l of config.necessities){ B += l.budget; S += l.cats ? l.cats.reduce((t,c)=>t+sp(c),0) : sp(l.cat); E += l.mode === "fixed" ? l.budget : l.budget*nfrac; }
  const disc = config.discretionary; B += disc.budget; S += disc.cats.reduce((t,c)=>t+sp(c),0); E += disc.budget*frac;
  return cls(S, E, B);
}
function renderMonths(){
  $("months").innerHTML = months.map(m => `<button type="button" id="m-${m.id}" class="${monthCls(m.data)}" aria-pressed="${m.id===selected}" data-id="${m.id}">${shortMonth(m.id)}</button>`).join("");
  $("months").querySelectorAll("button").forEach(b => b.onclick = () => { selected = b.dataset.id; renderMonths(); render(); });
}


const PASS_KEY = "budget-pass";
function getPass(){ try { return localStorage.getItem(PASS_KEY); } catch(e){ return null; } }
function setPass(p){ try { p ? localStorage.setItem(PASS_KEY, p) : localStorage.removeItem(PASS_KEY); } catch(e){} }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(blob, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function askPass(msg){
  $("asof").textContent = "";
  $("months").innerHTML = "";
  $("table").innerHTML = `<form class="lock" id="lock"><label for="pass">Passphrase</label><input id="pass" type="password" autocomplete="current-password" autofocus>${msg?`<div class="err">${msg}</div>`:""}<button type="submit">Open</button></form>`;
  $("lock").onsubmit = ev => { ev.preventDefault(); const p = $("pass").value; if (p){ setPass(p); load(); } };
}
async function load(){
  const pass = getPass();
  if (!pass) return askPass();
  let blob;
  try { const r = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"}); blob = await r.json(); }
  catch(e){ $("table").innerHTML = '<div class="msg">Could not load the numbers. Check your connection and reopen the app.</div>'; return; }
  let data;
  try { data = await decrypt(blob, pass); }
  catch(e){ setPass(null); return askPass("That passphrase didn't work. Try again."); }
  config = data.config;
  months = Object.keys(data.months).sort().map(id => ({id, data:data.months[id]}));
  if (!months.length){ $("table").innerHTML = '<div class="msg">No spend loaded yet.</div>'; return; }
  if (!selected || !months.some(m => m.id === selected)) selected = months[months.length-1].id;
  renderMonths(); render();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && getPass()) load(); });
load();
</script>
</body>
</html>
